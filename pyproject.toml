[project]
name = "monitoria-ia"
version = "1.0.0"
description = "Monitoria de qualidade de ligações de cobrança com IA: transcrição, avaliação por rubrica e painel."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7",
    "openai>=1.40,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monitoria*"]

[tool.setuptools.package-data]
monitoria = ["templates/*.html", "static/*", "static/fontes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
