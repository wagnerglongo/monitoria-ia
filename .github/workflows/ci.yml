name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[dev]"
      - run: pytest

  docker:
    name: Docker Compose com PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose build 2>&1 | tee build.log
      - run: docker compose up -d --wait
      - name: Exemplos são avaliados e aparecem na API
        run: |
          docker compose exec -T web python -m monitoria demo
          curl -fsS http://localhost:8000/api/ligacoes > ligacoes.json
          python3 -c "import json; l=json.load(open('ligacoes.json')); c=[x for x in l if x['status']=='concluida']; print(len(c), 'avaliadas'); assert len(c)==6"
          curl -fsS http://localhost:8000/ | grep -q "Qualidade das ligações"
      - name: Envio pela API e processamento pelo worker
        run: |
          id=$(curl -fsS -H "X-Requested-With: monitoria" \
            -F operador="Teste CI" -F contrato=ACM1 -F tipo=acordo -F data_ligacao=2026-10-09 \
            -F "arquivo=@exemplos/ligacoes/06-bruna-acordo-boa.txt" http://localhost:8000/api/ligacoes | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 30); do
            status=$(curl -fsS http://localhost:8000/api/ligacoes/$id | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$status" = "concluida" ] && exit 0
            sleep 2
          done
          echo "o worker não processou a ligação $id"; exit 1
      - if: failure()
        name: Logs (também como anotação, para leitura pela API)
        run: |
          docker compose ps -a
          docker compose logs --no-color > servicos.log 2>&1 || true
          cat servicos.log
          echo "::error title=build::$(tail -40 build.log 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          echo "::error title=servicos::$( (docker compose ps -a; tail -60 servicos.log) | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
